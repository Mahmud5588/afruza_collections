name: afruza_collection_mobile
description: Afruza Collection mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.3.1
  intl: ^0.20.0
  google_fonts: ^6.2.1
  equatable: ^2.0.5
  geolocator: ^12.0.0
  web_socket_channel: ^2.4.0
  sentry_flutter: ^8.10.1
  image_picker: ^1.0.7
  file_picker: ^8.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/branding/logo.png
  min_sdk_android: 21
